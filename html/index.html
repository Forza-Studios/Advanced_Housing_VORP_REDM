<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">

<style>

    body{
margin:0;
font-family:Arial;
background:transparent;
overflow:hidden;

    }

#panel{
position:absolute;
right:50px;
top:50%;
transform:translateY(-50%);
width:360px;

background:#101113;

border:1px solid rgba(255,255,255,.08);

border-radius:18px;

box-shadow:0 25px 60px rgba(0,0,0,.55);

padding:22px;

color:white;

backdrop-filter:blur(18px);

}

.hidden{
display:none;

}

.header h1{
margin:0;
font-size:28px;

}

.header p{
margin:5px 0 18px;
color:#8c9097;

}

.card{
background:#17191d;
padding:12px;
border-radius:12px;
margin-bottom:10px;

}

.label{
color:#8c9097;
font-size:12px;

}

.value{
font-size:15px;
font-weight:bold;

}

.buttons{
display:flex;
gap:10px;
margin-top:18px;

}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#262a31;
color:white;
cursor:pointer;

}

button:hover{
background:#363b44;

}
</style>
</head>
<body>

<div id="panel" class="hidden">

<div class="header">
<h1>Housing Creator</h1>
<p>Nearest Door Inspector</p>
</div>

<div id="content"></div>

<div class="buttons">
<button id="refresh">Refresh</button>
<button id="close">Close</button>
</div>

</div>

<script src="script.js"></script>

<script>
    const panel=document.getElementById("panel");
const content=document.getElementById("content");

window.addEventListener("message",(e)=>{

if(e.data.action==="open"){

panel.classList.remove("hidden");

render(e.data.data);

}

});

function render(d){

if(!d.found){

content.innerHTML="<div class='card'>No nearby door found.</div>";

return;

}

content.innerHTML=`
<div class="card">
<div class="label">Distance</div>
<div class="value">${d.distance} m</div>
</div>

<div class="card">
<div class="label">Entity</div>
<div class="value">${d.entity}</div>
</div>

<div class="card">
<div class="label">Model Hash</div>
<div class="value">${d.model}</div>
</div>

<div class="card">
<div class="label">Heading</div>
<div class="value">${d.heading}</div>
</div>

<div class="card">
<div class="label">Networked</div>
<div class="value">${d.networked}</div>
</div>

<div class="card">
<div class="label">Coordinates</div>
<div class="value">${d.x}, ${d.y}, ${d.z}</div>
</div>
`;

}

document.getElementById("close").onclick=()=>{

fetch(`https://${GetParentResourceName()}/close`,{

method:"POST"

});

panel.classList.add("hidden");

};

document.getElementById("refresh").onclick=async()=>{

const r=await fetch(`https://${GetParentResourceName()}/refresh`,{

method:"POST"

});

render(await r.json());

};

</script>

</body>
</html>
