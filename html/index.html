<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COI Housing Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="dashboard" class="hidden"></div>
<div id="partnerModalContainer" class="hidden"></div>

<script src="script.js"></script>

<script>
    const dashboard = document.getElementById("dashboard");

    // Listen for NUI open message
    window.addEventListener("message", (e) => {
        if (e.data.action === "open") {
            dashboard.classList.remove("hidden");
            currentFilter = "all";
            currentSearch = "";
            renderDashboard();
        } else if (e.data.action === "setHouses") {
            houseData = e.data.houses || [];
            renderDashboard();
        } else if (e.data.action === "openPartnerModal") {
            renderPartnerModal(e.data.data);
        } else if (e.data.action === "closePartnerModal") {
            closePartnerModalUI();
        } else if (e.data.action === "setNearbyPlayers") {
            renderNearbyPlayersSelect(e.data.players || []);
        } else if (e.data.action === "playSound") {
            if (typeof playLockSFX === "function") {
                playLockSFX(e.data.soundType === "lock");
            }
        }
    });

    // === DEV MODE: Auto-open for browser testing ===
    // Uncomment the line below to test in a browser without NUI
    // dashboard.classList.remove("hidden"); renderDashboard();
</script>

</body>
</html>
